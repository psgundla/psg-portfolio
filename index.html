<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/brand/psg-final/favicon/psg-white.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/brand/psg-final/favicon/psg-favicon-black-192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/brand/psg-final/favicon/psg-favicon-white.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/psg-final/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F5F7" />
    <meta name="color-scheme" content="light dark" />
    <title>Pranav Swaroop Gundla - AI for Cancer Research</title>
    <meta
      name="description"
      content="Pranav Swaroop Gundla builds interpretable AI for computational pathology, spatial biology, and glioma research."
    />
    <meta
      property="og:title"
      content="Pranav Swaroop Gundla - AI for Cancer Research"
    />
    <meta
      property="og:description"
      content="Computational pathology, spatial biology, and interpretable AI."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://psgundla.com/" />
    <meta
      property="og:image"
      content="https://psgundla.com/portfolio/hero_histology.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("portfolio-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === "dark" ? "#111A29" : "#F4F5F7";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
